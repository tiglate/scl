services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_dev
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${JDBC_DATABASE_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    # Adicionamos um healthcheck para o outro container saber quando o banco está pronto
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${JDBC_DATABASE_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 3s
      retries: 10

  mssql-setup:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_setup
    depends_on:
      sql-server:
        condition: service_healthy
    user: root
    environment:
      - JDBC_DATABASE_DB=${JDBC_DATABASE_DB}
      - JDBC_DATABASE_PASSWORD=${JDBC_DATABASE_PASSWORD}
    command: >
      /bin/bash -c "
      /opt/mssql-tools18/bin/sqlcmd -S sql-server -U sa -P $${JDBC_DATABASE_PASSWORD} -Q \"IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = '$${JDBC_DATABASE_DB}') CREATE DATABASE [$${JDBC_DATABASE_DB}]\" -C;
      echo 'Banco de dados '$${JDBC_DATABASE_DB}' verificado/criado com sucesso!';
      "

  mail-server:
    image: axllent/mailpit
    container_name: mail_dev
    restart: always
    ports:
      - "1025:1025" # Porta para o seu App enviar e-mail (SMTP)
      - "8025:8025" # Interface Web para você ver os e-mails
    environment:
      - MP_MAX_MESSAGES=500
      - MP_DATABASE=/data/mailpit.db
    volumes:
      - mail_data:/data

  ldap-server:
    build: ./docker/ldap
    container_name: ldap_dev
    restart: always
    ports:
      - "1389:389"
    environment:
      - LDAP_BASE_DN=${SPRING_LDAP_BASE}
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b \"\" -s base \"objectclass=*\""]
      interval: 10s
      timeout: 5s
      retries: 5

  ldap-seed:
    build: ./docker/ldap
    container_name: ldap_seed
    depends_on:
      ldap-server:
        condition: service_healthy
    restart: "no"
    environment:
      - SPRING_LDAP_BASE=${SPRING_LDAP_BASE}
      - SPRING_LDAP_USERNAME=${SPRING_LDAP_USERNAME}
      - SPRING_LDAP_PASSWORD=${SPRING_LDAP_PASSWORD}
      - LDAP_USER1_PASSWORD=${LDAP_USER1_PASSWORD}
      - LDAP_USER2_PASSWORD=${LDAP_USER2_PASSWORD}
    entrypoint: ["/bin/sh", "/seed/startup.sh"]
    volumes:
      - ./docker/ldap/bootstrap/startup.sh:/seed/startup.sh:ro

  # Dev Container Application
  app:
    image: mcr.microsoft.com/devcontainers/java:17
    volumes:
      - .:/workspaces/scl:cached
    command: sleep infinity
    environment:
      - JDBC_DATABASE_PASSWORD=${JDBC_DATABASE_PASSWORD}
      - JDBC_DATABASE_HOST=sql-server
      - JDBC_DATABASE_DB=${JDBC_DATABASE_DB}
      - JDBC_DATABASE_USERNAME=${JDBC_DATABASE_USERNAME}
      - SMTP_HOST=mail-server
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_PORT=${SMTP_PORT}
      - SPRING_LDAP_URLS=ldap://ldap_dev:389
      - SPRING_LDAP_BASE=${SPRING_LDAP_BASE}
      - SPRING_LDAP_USERNAME=${SPRING_LDAP_USERNAME}
      - SPRING_LDAP_PASSWORD=${SPRING_LDAP_PASSWORD}
    depends_on:
      sql-server:
        condition: service_healthy
      mail-server:
        condition: service_started
      ldap-server:
        condition: service_healthy
      ldap-seed:
        condition: service_completed_successfully

volumes:
  mssql_data:
  mail_data:
  ldap_data:
  ldap_config:
