spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer;NON_KEYWORDS=VALUE;INIT=CREATE DOMAIN IF NOT EXISTS "UNIQUEIDENTIFIER" AS UUID
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.type.preferred_uuid_jdbc_type: VARCHAR
      hibernate.globally_quoted_identifiers: false
  flyway:
    enabled: false
