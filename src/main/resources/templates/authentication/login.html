<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SCL - Login</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}" rel="stylesheet" />
    <link th:href="@{/css/login.css}" rel="stylesheet" />

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" defer></script>
    <script th:src="@{/js/app.js}" type="module" defer></script>
</head>
<body>
    <!--/*@thymesVar id="MSG_SUCCESS" type="java.lang.String"*/-->
    <!--/*@thymesVar id="MSG_INFO" type="java.lang.String"*/-->
    <!--/*@thymesVar id="MSG_ERROR" type="java.lang.String"*/-->

    <div class="login-card">
        <div class="text-center">
            <div class="brand-icon">
                <img th:src="@{/images/logo.svg}" alt="SCL" width="30" height="30" class="d-inline-block align-top" style="filter: invert(100%);">
            </div>
            <h4 class="fw-bold mb-1">Welcome Back</h4>
            <p class="text-muted mb-4">Please enter your details</p>
            <p th:if="${MSG_SUCCESS}" class="alert alert-success mb-4" role="alert">[[${MSG_SUCCESS}]]</p>
            <p th:if="${MSG_INFO}" class="alert alert-info mb-4" role="alert">[[${MSG_INFO}]]</p>
            <p th:if="${MSG_ERROR}" class="alert alert-danger mb-4" role="alert">[[${MSG_ERROR}]]</p>
        </div>

        <!--/*@thymesVar id="requestUri" type="java.lang.String"*/-->
        <form th:action="${requestUri}" method="post" th:object="${authentication}">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <input type="text"
                       class="form-control"
                       id="username"
                       placeholder="Enter your username"
                       required
                       th:field="*{username}"
                       th:classappend="${#fields.hasErrors('username') ? 'is-invalid' : ''}" />
                <div th:if="${#fields.hasErrors('username')}" class="invalid-feedback d-block">
                    <p th:each="error : ${#fields.errors('username')}" class="mb-0">[[${error}]]</p>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <a th:href="@{/passwordReset/start}" class="forgot-link">Forgot password?</a>
                </div>
                <input type="password"
                       class="form-control"
                       id="password"
                       placeholder="••••••••"
                       required
                       th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}" />
                <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback d-block">
                    <p th:each="error : ${#fields.errors('password')}" class="mb-0">[[${error}]]</p>
                </div>
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" th:field="*{rememberMe}">
                <label class="form-check-label" for="rememberMe">Remember me for 30 days</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
        </form>

        <div class="text-center">
            <p class="small text-muted mb-0">SCL – Settlement Control System</p>
        </div>
    </div>
</body>
</html>
