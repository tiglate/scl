<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en"
      layout:decorate="~{layout}">
<head>
    <title>Edit Currency</title>
</head>
<body>
    <!--/*@thymesVar id="requestUri" type="java.lang.String"*/-->
    <div layout:fragment="content">
        <div th:replace="~{fragments/header :: header('edit', 'Edit Currency', 'currencyForm', @{/currencies})}"></div>
        <div th:replace="~{fragments/form-utils::globalErrors('currency')}"></div>
        <form th:action="${requestUri}" method="post" id="currencyForm">
            <th:block th:replace="~{currency/_form :: currencyForm('edit', ${currency})}"></th:block>
        </form>
    </div>
</body>
</html>
