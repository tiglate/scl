<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Role Form</title>
</head>
<body>
    <!--/*@thymesVar id="role" type="ludo.mentis.aciem.scl.model.RoleDTO"*/-->
    <!--/*@thymesVar id="mode" type="java.lang.String"*/-->
    <th:block th:fragment="roleForm(mode, role)" th:object="${role}">
        <div class="card shadow mb-3">
            <div class="card-header">
                Details
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-sm-3">
                        <label for="txtName" class="form-label">Code*</label>
                        <input type="text"
                               id="txtCode"
                               class="form-control text-uppercase"
                               th:field="*{code}"
                               th:disabled="${mode == 'view'}"
                               th:classappend="${#fields.hasErrors('code') ? 'is-invalid' : ''}" />
                        <div th:if="${#fields.hasErrors('code')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('code')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-sm-9">
                        <label for="txtDescription" class="form-label">Description</label>
                        <input type="text"
                               id="txtDescription"
                               class="form-control"
                               th:field="*{description}"
                               th:disabled="${mode == 'view'}"
                               th:classappend="${#fields.hasErrors('description') ? 'is-invalid' : ''}" />
                        <div th:if="${#fields.hasErrors('description')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('description')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow mb-3" th:if="${mode != 'add'}">
            <div class="card-header">
                Audit
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-2">
                        <label for="txtId" class="form-label">Id</label>
                        <input type="number" id="txtId" th:field="*{id}" disabled="disabled" class="form-control" />
                    </div>
                    <div class="col-md-5">
                        <label for="txtCreatedAt" class="form-label">Input Date</label>
                        <input type="text" id="txtCreatedAt" disabled="disabled" class="form-control" th:value="${#temporals.format(role.createdAt, 'dd-MMM-yyyy HH:mm:ss')}"  />
                    </div>
                    <div class="col-md-5">
                        <label for="txtUpdatedAt" class="form-label">Last Update</label>
                        <input type="text" id="txtUpdatedAt" disabled="disabled" class="form-control" th:value="${#temporals.format(role.updatedAt, 'dd-MMM-yyyy HH:mm:ss')}"  />
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
