<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en"
      layout:decorate="~{layout}">
<head>
    <title>Add Role</title>
</head>
<body>
    <!--/*@thymesVar id="requestUri" type="java.lang.String"*/-->
    <div layout:fragment="content">
        <div th:replace="~{fragments/header :: header('add', 'Add Role', 'roleForm', @{/roles})}"></div>
        <div th:replace="~{fragments/form-utils::globalErrors('role')}"></div>
        <form th:action="${requestUri}" method="post" id="roleForm">
            <th:block th:replace="~{role/_form :: roleForm('add', ${role})}"></th:block>
        </form>
    </div>
</body>
</html>
