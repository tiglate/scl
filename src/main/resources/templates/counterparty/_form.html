<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Counterparty Form</title>
</head>
<body>
    <!--/*@thymesVar id="counterparty" type="ludo.mentis.aciem.scl.model.CounterpartyDTO"*/-->
    <!--/*@thymesVar id="mode" type="java.lang.String"*/-->
    <th:block th:fragment="counterpartyForm(mode, counterparty)" th:object="${counterparty}">
        <script type="application/json" id="existing-documents-json" th:inline="javascript">
            [[${counterparty.documents}]]
        </script>

        <div class="card shadow mb-3">
            <div class="card-header">
                Details
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-sm-2">
                        <label for="txtCode" class="form-label">Code</label>
                        <input type="number"
                               id="txtCode"
                               class="form-control text-uppercase"
                               th:field="*{originId}"
                               th:disabled="${mode == 'view'}"
                               th:classappend="${#fields.hasErrors('originId') ? 'is-invalid' : ''}" />
                        <div th:if="${#fields.hasErrors('originId')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('originId')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <label for="txtShortName" class="form-label">Short Name</label>
                        <input type="text"
                               id="txtShortName"
                               class="form-control"
                               maxlength="255"
                               th:field="*{shortName}"
                               th:disabled="${mode == 'view'}"
                               th:classappend="${#fields.hasErrors('shortName') ? 'is-invalid' : ''}" />
                        <div th:if="${#fields.hasErrors('shortName')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('shortName')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <label for="txtLongName" class="form-label">Long Name*</label>
                        <input type="text"
                               id="txtLongName"
                               class="form-control"
                               maxlength="255"
                               th:field="*{longName}"
                               th:disabled="${mode == 'view'}"
                               th:classappend="${#fields.hasErrors('longName') ? 'is-invalid' : ''}" />
                        <div th:if="${#fields.hasErrors('longName')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('longName')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label for="cboEnabled" class="form-label">Enabled*</label>
                        <select id="cboEnabled"
                                class="form-select"
                                th:field="*{isActive}"
                                th:disabled="${mode == 'view'}"
                                th:classappend="${#fields.hasErrors('isActive') ? 'is-invalid' : ''}">
                            <option value="">Please select</option>
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                        <div th:if="${#fields.hasErrors('isActive')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('isActive')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

		<div class="card shadow mb-3">
			<div class="card-header">Documents</div>
			<div class="card-body" id="documents-container"></div>
			<div class="card-footer text-end" th:if="${mode != 'view'}">
				<button type="button" class="btn btn-primary" id="add-document-btn">
					<i class="bi-plus-circle-fill"></i> Add Document
				</button>
			</div>
		</div>

		<div class="card shadow mb-3" th:if="${mode != 'add'}">
            <div class="card-header">
                Audit
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-2">
                        <label for="txtId" class="form-label">Id</label>
                        <input type="number" id="txtId" th:field="*{id}" disabled="disabled" class="form-control" />
                    </div>
                    <div class="col-md-3">
                        <label for="txtCreatedAt" class="form-label">Input Date</label>
                        <input type="text" id="txtCreatedAt" disabled="disabled" class="form-control" th:value="${#temporals.format(counterparty.createdAt, 'dd-MMM-yyyy HH:mm:ss')}" />
                    </div>
                    <div class="col-md-3">
                        <label for="txtUpdatedAt" class="form-label">Last Update</label>
                        <input type="text" id="txtUpdatedAt" disabled="disabled" class="form-control" th:value="${#temporals.format(counterparty.updatedAt, 'dd-MMM-yyyy HH:mm:ss')}" />
                    </div>
                    <div class="col-md-4">
                        <label for="txtUpdatedBy" class="form-label">Updated By</label>
                        <input type="text" id="txtUpdatedBy" th:field="*{updatedByName}" disabled="disabled" class="form-control" />
                    </div>
                </div>
            </div>
        </div>
        
		<template id="document-template">
		    <div class="document-row">
		        <input type="hidden" name="documents[__INDEX__].id" value="__ID__" />
		        <input type="hidden" name="documents[__INDEX__].action" value="__ACTION__" />
		
		        <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Type*</label>
                        <select name="documents[__INDEX__].documentTypeId" class="form-select" th:disabled="${mode == 'view'}" required>
                            <option value="">-- Select --</option>
                            <option th:each="dt : ${documentTypeValues}" th:value="${dt.key}" th:text="${dt.value}"></option>
                        </select>
                    </div>
		            <div class="col-md-4 mb-3">
		                <label class="form-label">Value*</label>
		                <input type="text" name="documents[__INDEX__].value" value="__VALUE__" class="form-control" th:disabled="${mode == 'view'}" required />
		            </div>
		            <div class="col-md-4 mb-3">
		                <label class="form-label">Expiration</label>
		                <input type="date" name="documents[__INDEX__].expiration" value="__EXPIRATION__" class="form-control" th:disabled="${mode == 'view'}" />
		            </div>
		            <div class="col-md-1 mb-3 d-flex align-items-end">
		                <button type="button" class="btn btn-danger" th:disabled="${mode == 'view'}">
		                    <i class="bi bi-x-circle-fill"></i>
		                </button>
		            </div>
		        </div>
		    </div>
		</template>
    </th:block>
</body>
</html>
