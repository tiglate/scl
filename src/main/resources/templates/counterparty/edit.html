<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en"
      layout:decorate="~{layout}">
<head>
    <title>Edit Counterparty</title>
</head>
<body>
    <!--/*@thymesVar id="requestUri" type="java.lang.String"*/-->
    <div layout:fragment="content">
        <div th:replace="~{fragments/header :: header('edit', 'Edit Counterparty', 'counterpartyForm', @{/counterparties})}"></div>
        <div th:replace="~{fragments/form-utils::globalErrors('counterparty')}"></div>
        <form th:action="${requestUri}" method="post" id="counterpartyForm">
            <th:block th:replace="~{counterparty/_form :: counterpartyForm('edit', ${counterparty})}"></th:block>
        </form>
    </div>
</body>
</html>
