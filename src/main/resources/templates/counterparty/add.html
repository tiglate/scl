<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}">
    <head>
        <title>[[#{counterparty.add.headline}]]</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="d-flex flex-wrap mb-4">
                <h1 class="flex-grow-1">[[#{counterparty.add.headline}]]</h1>
                <div>
                    <a th:href="@{/counterparties}" class="btn btn-secondary">[[#{counterparty.add.back}]]</a>
                </div>
            </div>
            <div th:replace="~{fragments/forms::globalErrors('counterparty')}" />
            <form th:action="${requestUri}" method="post" novalidate="">
                <div th:replace="~{fragments/forms::inputRow(object='counterparty', field='originId', type='number')}" />
                <div th:replace="~{fragments/forms::inputRow(object='counterparty', field='longName', required=true)}" />
                <div th:replace="~{fragments/forms::inputRow(object='counterparty', field='shortName')}" />
                <div th:replace="~{fragments/forms::inputRow(object='counterparty', field='isActive', type='checkbox')}" />
                <div th:replace="~{fragments/forms::inputRow(object='counterparty', field='createdAt', required=true, inputClass='js-datetimepicker')}" />
                <div th:replace="~{fragments/forms::inputRow(object='counterparty', field='updatedAt', required=true, inputClass='js-datetimepicker')}" />
                <div th:replace="~{fragments/forms::inputRow(object='counterparty', field='updatedBy', type='select')}" />
                <div th:replace="~{fragments/forms::inputRow(object='counterparty', field='documents', type='multiselect')}" />
                <input type="submit" th:value="#{counterparty.add.headline}" class="btn btn-primary mt-4" />
            </form>
        </div>
    </body>
</html>
