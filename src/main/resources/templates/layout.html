<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
            xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">SCL</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet" />
        <link th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}" rel="stylesheet" />
        <link th:href="@{/webjars/flatpickr/dist/flatpickr.min.css}" rel="stylesheet" />
        <link th:href="@{/webjars/datatables/css/dataTables.bootstrap5.min.css}" rel="stylesheet" />
        <link th:href="@{/css/app.css}" rel="stylesheet" />
        <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" defer></script>
        <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
        <script th:src="@{/webjars/jquery/jquery.min.js}" defer></script>
        <script th:src="@{/webjars/flatpickr/dist/flatpickr.min.js}" defer></script>
        <script th:src="@{/webjars/datatables/js/dataTables.min.js}" defer></script>
        <script th:src="@{/webjars/datatables/js/dataTables.bootstrap5.min.js}" defer></script>
        <script th:src="@{/js/app.js}" type="module" defer></script>
    </head>
    <body hx-boost="true">
        <header id="main-header" data-bs-theme="dark">
            <div class="container">
                <nav class="navbar navbar-expand-md">
                    <a th:href="@{/}" class="navbar-brand">
                        <img th:src="@{/images/logo.svg}" alt="SCL" width="30" height="30" class="d-inline-block align-top" style="filter: invert(100%);">
                        <span class="ps-1">SCL</span>
                    </a>
                    <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarToggle"
                            aria-label="Toggle navigation" aria-controls="navbarToggle" aria-expanded="false">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarToggle">
                        <ul class="navbar-nav ms-auto">
                            <li class="navbar-item">
                                <a th:href="@{/}" class="nav-link">Home</a>
                            </li>
                            <li class="navbar-item dropdown">
                                <button type="button" class="nav-link dropdown-toggle" data-bs-toggle="dropdown" id="navbarEntitiesLink"
                                        aria-expanded="false">Menu</button>
                                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarEntitiesLink">
                                    <li><a th:href="@{/departments}" class="dropdown-item">Departments</a></li>
                                    <li><a th:href="@{/users}" class="dropdown-item">Users</a></li>
                                    <li><a th:href="@{/roles}" class="dropdown-item">Roles</a></li>
                                    <li><a th:href="@{/counterparties}" class="dropdown-item">Counterparties</a></li>
                                    <li><a th:href="@{/currencies}" class="dropdown-item">Currencies</a></li>
                                    <li><a th:href="@{/fxTrades}" class="dropdown-item">FX Trades</a></li>
                                    <li><a th:href="@{/fxSettlements}" class="dropdown-item">FX Settlements</a></li>
                                    <li><a th:href="@{/documentTypes}" class="dropdown-item">Document Types</a></li>
                                </ul>
                            </li>
                            <li class="navbar-item">
                                <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="nav-link" hx-boost="false">Login</a>
                                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="nav-link">
                                    <input value="Logout" type="submit" class="unset" />
                                </form>
                            </li>
                        </ul>
                    </div>
                </nav>
            </div>
        </header>
        <main class="my-5">
            <div class="container">
                <!--/*@thymesVar id="MSG_SUCCESS" type="java.lang.String"*/-->
                <!--/*@thymesVar id="MSG_INFO" type="java.lang.String"*/-->
                <!--/*@thymesVar id="MSG_ERROR" type="java.lang.String"*/-->
                <p th:if="${MSG_SUCCESS}" class="alert alert-success mb-4" role="alert">[[${MSG_SUCCESS}]]</p>
                <p th:if="${MSG_INFO}" class="alert alert-info mb-4" role="alert">[[${MSG_INFO}]]</p>
                <p th:if="${MSG_ERROR}" class="alert alert-danger mb-4" role="alert">[[${MSG_ERROR}]]</p>
                <div layout:fragment="content"></div>
            </div>
        </main>
    </body>
</html>
