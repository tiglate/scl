<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}">
    <head>
        <title>[[#{fxTrade.edit.headline}]]</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="d-flex flex-wrap mb-4">
                <h1 class="flex-grow-1">[[#{fxTrade.edit.headline}]]</h1>
                <div>
                    <a th:href="@{/fxTrades}" class="btn btn-secondary">[[#{fxTrade.edit.back}]]</a>
                </div>
            </div>
            <div th:replace="~{fragments/forms::globalErrors('fxTrade')}" />
            <form th:action="${requestUri}" method="post" novalidate="">
                <input type="submit" th:value="#{fxTrade.edit.headline}" class="btn btn-primary mt-4 mb-4" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='id', disabled=true, type='number')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='tradeId')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='tradeDate', inputClass='js-datepicker')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='valueDate', inputClass='js-datepicker')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='product', type='radio')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='buyAmount')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='sellAmount')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='investorManager')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='beneficiary')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='purpose', type='radio')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='createdAt', required=true, inputClass='js-datetimepicker')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='updatedAt', required=true, inputClass='js-datetimepicker')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='exchangeRate')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='counterparty', required=true, type='select')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='buyCurrency', type='select')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='sellCurrency', type='select')}" />
                <div th:replace="~{fragments/forms::inputRow(object='fxTrade', field='updatedBy', type='select')}" />
                <input type="submit" th:value="#{fxTrade.edit.headline}" class="btn btn-primary mt-4" />
            </form>
        </div>
    </body>
</html>
