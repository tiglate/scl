<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en"
      layout:decorate="~{layout}">
<head>
    <title>Add FX Trade</title>
</head>
<body>
    <!--/*@thymesVar id="requestUri" type="java.lang.String"*/-->
    <div layout:fragment="content">
        <div th:replace="~{fragments/header :: header('add', 'Add FX Trade', 'fxTradeForm', @{/fxTrades})}"></div>
        <div th:replace="~{fragments/form-utils::globalErrors('fxTrade')}"></div>
        <form th:action="${requestUri}" method="post" id="fxTradeForm">
            <th:block th:replace="~{fxTrade/_form :: fxTradeForm('add', ${fxTrade})}"></th:block>
        </form>
    </div>
</body>
</html>
