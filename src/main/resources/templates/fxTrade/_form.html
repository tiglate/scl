<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>FxTrade Form</title>
</head>
<body>
    <!--/*@thymesVar id="fxTrade" type="ludo.mentis.aciem.scl.model.FxTradeDTO"*/-->
    <!--/*@thymesVar id="mode" type="java.lang.String"*/-->
    <th:block th:fragment="fxTradeForm(mode, fxTrade)" th:object="${fxTrade}">
        <div class="card shadow mb-3">
            <div class="card-header">
                Details
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label for="cboProduct" class="form-label">Product*</label>
                        <select id="cboProduct"
                                class="form-select"
                                th:field="*{product}"
                                th:disabled="${mode == 'view'}"
                                th:classappend="${#fields.hasErrors('product') ? 'is-invalid' : ''}">
                            <option value="">Please select</option>
                            <option th:each="optionValue : ${productValues}" th:value="${optionValue}">[[${optionValue.getDisplayName()}]]</option>
                        </select>
                        <div th:if="${#fields.hasErrors('product')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('product')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label for="cboPurpose" class="form-label">Purpose</label>
                        <select id="cboPurpose"
                                class="form-select"
                                th:field="*{purpose}"
                                th:disabled="${mode == 'view'}"
                                th:classappend="${#fields.hasErrors('purpose') ? 'is-invalid' : ''}">
                            <option value="">Please select</option>
                            <option th:each="optionValue : ${purposeValues}" th:value="${optionValue}">[[${optionValue.getDisplayName()}]]</option>
                        </select>
                        <div th:if="${#fields.hasErrors('purpose')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('purpose')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label for="txtTradeId" class="form-label">Trade Id</label>
                        <input type="text"
                               id="txtTradeId"
                               class="form-control text-uppercase"
                               th:field="*{tradeId}"
                               th:disabled="${mode == 'view'}"
                               th:classappend="${#fields.hasErrors('tradeId') ? 'is-invalid' : ''}" />
                        <div th:if="${#fields.hasErrors('tradeId')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('tradeId')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label for="txtTradeDate" class="form-label">Trade Date*</label>
                        <input type="date"
                               id="txtTradeDate"
                               class="form-control"
                               maxlength="255"
                               th:field="*{tradeDate}"
                               th:disabled="${mode == 'view'}"
                               th:classappend="${#fields.hasErrors('tradeDate') ? 'is-invalid' : ''}" />
                        <div th:if="${#fields.hasErrors('tradeDate')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('tradeDate')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label for="txtValueDate" class="form-label">Value Date*</label>
                        <input type="date"
                               id="txtValueDate"
                               class="form-control"
                               maxlength="255"
                               th:field="*{valueDate}"
                               th:disabled="${mode == 'view'}"
                               th:classappend="${#fields.hasErrors('valueDate') ? 'is-invalid' : ''}" />
                        <div th:if="${#fields.hasErrors('valueDate')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('valueDate')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="cboCounterparty" class="form-label">Counterparty*</label>
                        <select id="cboCounterparty"
                                class="form-select"
                                th:field="*{counterpartyId}"
                                th:disabled="${mode == 'view'}"
                                th:classappend="${#fields.hasErrors('counterpartyId') ? 'is-invalid' : ''}">
                            <option value="">Please select</option>
                            <option th:each="optionValue : ${counterpartyValues}" th:value="${optionValue.key}">[[${optionValue.value}]]</option>
                        </select>
                        <div th:if="${#fields.hasErrors('counterpartyId')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('counterpartyId')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label for="txtInvestorManager" class="form-label">Investor Manager</label>
                        <input type="text"
                               id="txtInvestorManager"
                               class="form-control"
                               maxlength="255"
                               th:field="*{investorManager}"
                               th:disabled="${mode == 'view'}"
                               th:classappend="${#fields.hasErrors('investorManager') ? 'is-invalid' : ''}" />
                        <div th:if="${#fields.hasErrors('investorManager')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('investorManager')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <label for="txtBeneficiary" class="form-label">Beneficiary</label>
                        <input type="text"
                               id="txtBeneficiary"
                               class="form-control"
                               maxlength="255"
                               th:field="*{beneficiary}"
                               th:disabled="${mode == 'view'}"
                               th:classappend="${#fields.hasErrors('beneficiary') ? 'is-invalid' : ''}" />
                        <div th:if="${#fields.hasErrors('beneficiary')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('beneficiary')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-2">
                        <label for="cboBuyCurrency" class="form-label">Buy Currency*</label>
                        <select id="cboBuyCurrency"
                                class="form-select"
                                th:field="*{buyCurrencyId}"
                                th:disabled="${mode == 'view'}"
                                th:classappend="${#fields.hasErrors('buyCurrencyId') ? 'is-invalid' : ''}">
                            <option value="">Please select</option>
                            <option th:each="optionValue : ${currencyValues}" th:value="${optionValue.key}">[[${optionValue.value}]]</option>
                        </select>
                        <div th:if="${#fields.hasErrors('buyCurrencyId')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('buyCurrencyId')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label for="txtBuyAmount" class="form-label">Buy Amount*</label>
                        <input type="number"
                               id="txtBuyAmount"
                               class="form-control"
                               min="0"
                               step=".01"
                               th:field="*{buyAmount}"
                               th:disabled="${mode == 'view'}"
                               th:classappend="${#fields.hasErrors('buyAmount') ? 'is-invalid' : ''}" />
                        <div th:if="${#fields.hasErrors('buyAmount')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('buyAmount')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label for="cboSellCurrency" class="form-label">Sell Currency*</label>
                        <select id="cboSellCurrency"
                                class="form-select"
                                th:field="*{sellCurrencyId}"
                                th:disabled="${mode == 'view'}"
                                th:classappend="${#fields.hasErrors('sellCurrencyId') ? 'is-invalid' : ''}">
                            <option value="">Please select</option>
                            <option th:each="optionValue : ${currencyValues}" th:value="${optionValue.key}">[[${optionValue.value}]]</option>
                        </select>
                        <div th:if="${#fields.hasErrors('sellCurrencyId')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('sellCurrencyId')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label for="txtSellAmount" class="form-label">Sell Amount*</label>
                        <input type="number"
                               id="txtSellAmount"
                               class="form-control"
                               min="0"
                               step=".01"
                               th:field="*{sellAmount}"
                               th:disabled="${mode == 'view'}"
                               th:classappend="${#fields.hasErrors('sellAmount') ? 'is-invalid' : ''}" />
                        <div th:if="${#fields.hasErrors('sellAmount')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('sellAmount')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label for="txtExchangeRate" class="form-label">Exchange Rate</label>
                        <input type="number"
                               id="txtExchangeRate"
                               class="form-control"
                               min="0"
                               step=".000001"
                               th:field="*{exchangeRate}"
                               th:disabled="${mode == 'view'}"
                               th:classappend="${#fields.hasErrors('exchangeRate') ? 'is-invalid' : ''}" />
                        <div th:if="${#fields.hasErrors('exchangeRate')}" class="invalid-feedback d-block">
                            <p th:each="error : ${#fields.errors('exchangeRate')}" class="mb-0">[[${error}]]</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

		<div class="card shadow mb-3" th:if="${mode != 'add'}">
            <div class="card-header">
                Audit
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-2">
                        <label for="txtId" class="form-label">Id</label>
                        <input type="number" id="txtId" th:field="*{id}" disabled="disabled" class="form-control" />
                    </div>
                    <div class="col-md-3">
                        <label for="txtCreatedAt" class="form-label">Input Date</label>
                        <input type="text" id="txtCreatedAt" disabled="disabled" class="form-control" th:value="${#temporals.format(fxTrade.createdAt, 'dd-MMM-yyyy HH:mm:ss')}" />
                    </div>
                    <div class="col-md-3">
                        <label for="txtUpdatedAt" class="form-label">Last Update</label>
                        <input type="text" id="txtUpdatedAt" disabled="disabled" class="form-control" th:value="${#temporals.format(fxTrade.updatedAt, 'dd-MMM-yyyy HH:mm:ss')}" />
                    </div>
                    <div class="col-md-4">
                        <label for="txtUpdatedBy" class="form-label">Updated By</label>
                        <input type="text" id="txtUpdatedBy" th:field="*{updatedByName}" disabled="disabled" class="form-control" />
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
